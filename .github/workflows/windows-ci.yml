name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test, and build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Flutter packages
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Rust tests
        working-directory: engine
        run: cargo test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\FutureMirror | Out-Null
          Copy-Item -Recurse build\windows\x64\runner\Release\* package\FutureMirror
          if (Test-Path engine\target\release\futuremirror_engine.exe) {
            New-Item -ItemType Directory -Force -Path package\FutureMirror\engine\target\release | Out-Null
            Copy-Item engine\target\release\futuremirror_engine.exe package\FutureMirror\engine\target\release\
          }
          Copy-Item README.md,LICENSE package\FutureMirror\
          Compress-Archive -Path package\FutureMirror -DestinationPath package\FutureMirror-Windows-x64.zip

      - name: Upload portable release
        uses: actions/upload-artifact@v4
        with:
          name: FutureMirror-Windows-x64
          path: package/FutureMirror-Windows-x64.zip
